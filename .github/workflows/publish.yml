name: Publish

# On every merge to main: redraw the four parts' blueprints, the README header preview and their README embeds (common-blueprint-generator
# render.yml@v1), then cut a patch release with a prints zip and a source zip (release.yml@v1). Run it by hand to choose a minor or major bump.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for this release
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  blueprint:
    uses: csmarshall/common-blueprint-generator/.github/workflows/render.yml@v1
    with:
      configs: blueprints/stand.yml blueprints/wedge.yml blueprints/pulley_core.yml blueprints/petal.yml
      commit-paths: blueprints README.md
  release:
    needs: blueprint
    uses: csmarshall/common-blueprint-generator/.github/workflows/release.yml@v1
    with:
      bump: ${{ inputs.bump || 'patch' }}
      prints-paths: stl step blueprints NOTICE.md LICENSES
